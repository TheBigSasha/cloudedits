name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Public boundary check
        run: ./scripts/check-public-boundary.sh

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true

      - name: Go vet (release and dev_apis)
        run: |
          go vet ./...
          go vet -tags dev_apis ./...

      - name: Go test with race detector (release)
        run: go test -race -count=1 ./...

      - name: Go test with race detector (dev_apis)
        run: go test -race -count=1 -tags dev_apis ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.15.0

      - name: Verify release binary contains no dev_apis code
        run: |
          # Check the shipped (stripped) form as well as an unstripped build:
          # `go tool nm` sees nothing in a -s -w binary, so the script's
          # string scan is what covers it.
          go build -trimpath -ldflags="-s -w" -o /tmp/cloudedits-release ./cmd/cloudedits
          go build -trimpath -o /tmp/cloudedits-release-symbols ./cmd/cloudedits
          ./packaging/scripts/check-release-symbols.sh /tmp/cloudedits-release /tmp/cloudedits-release-symbols
          ls -lh /tmp/cloudedits-release
          rm -f /tmp/cloudedits-release /tmp/cloudedits-release-symbols
