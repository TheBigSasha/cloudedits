openapi: 3.1.0
info:
  title: hdr.toys Remote Library HTTP API
  version: 1.0.0
  license:
    name: MIT
    identifier: MIT
  description: |
    Remote photo library API implemented by cloudedits with the `chrome-local-parity/1` profile.
    Source photo files are strictly read-only; mutations commit atomically to `.hdrtoys/<rel>.edits`.
servers:
  - url: https://library.example.ts.net
    description: Dedicated Tailscale tsnet node
  - url: http://127.0.0.1:8787
    description: Local loopback server
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
  parameters:
    Sort:
      name: sort
      in: query
      description: Sort field, optionally with a direction suffix (`name_asc`, `rating_desc`).
      schema:
        type: string
        pattern: "^(captured|imported|edited|name|rating)(_asc|_desc)?$"
    Dir:
      name: dir
      in: query
      description: Sort direction; overrides a `sort` suffix.
      schema:
        type: string
        enum: [asc, desc]
    Flag:
      name: flag
      in: query
      schema:
        type: string
        enum: [pick, reject, any, none]
    Label:
      name: label
      in: query
      description: A color label, `any` (any labeled) or `none`.
      schema:
        type: string
    Kind:
      name: kind
      in: query
      description: Repeatable or comma-separated, matched with OR. `raw`, `image`, `photo`, or a file extension.
      schema:
        type: array
        items:
          type: string
  schemas:
    CapabilitiesResponse:
      type: object
      required: [version, protocol, profiles, caps, permissions, limits, library]
      properties:
        version:
          type: integer
        protocol:
          type: object
          required: [name, version, minCompat]
          properties:
            name:
              type: string
            version:
              type: integer
            minCompat:
              type: integer
        profiles:
          type: array
          items:
            type: string
        caps:
          type: object
          additionalProperties: true
        permissions:
          type: array
          items:
            type: string
        limits:
          type: object
          additionalProperties: true
        library:
          type: object
          required: [id, name]
          properties:
            id:
              type: string
            name:
              type: string
            scratch:
              type: string
    AssetSummary:
      type: object
      required: [id, name, relPath, folderId, kind, sizeBytes, sourceRevision]
      properties:
        id:
          type: string
        folderId:
          type: string
        relPath:
          type: string
        name:
          type: string
        kind:
          type: string
        mimeType:
          type: string
        sizeBytes:
          type: integer
        mtimeMs:
          type: integer
        sourceRevision:
          type: string
        width:
          type: integer
        height:
          type: integer
        orientation:
          type: integer
        hasGainMap:
          type: boolean
        capturedAt:
          type: string
        importedAt:
          type: string
        editedAt:
          type: string
        rating:
          type: integer
        flag:
          type: [string, "null"]
        colorLabel:
          type: [string, "null"]
        keywords:
          type: array
          items:
            type: string
        editedByHdrToys:
          type: boolean
        thumbnailUrl:
          type: string
        rawUrl:
          type: string
        recipeUrl:
          type: string
        exif:
          type: object
          additionalProperties: true
    GridAsset:
      type: object
      description: Compact projection returned by list endpoints when `fields=grid`.
      required: [id, folderId, name, kind, mimeType, sourceRevision, width, height, hasGainMap, capturedAt, rating, flag, colorLabel, editedByHdrToys]
      properties:
        id:
          type: string
        folderId:
          type: string
        name:
          type: string
        kind:
          type: string
        mimeType:
          type: string
        sourceRevision:
          type: string
        width:
          type: integer
        height:
          type: integer
        hasGainMap:
          type: boolean
        capturedAt:
          type: string
        rating:
          type: integer
        flag:
          type: [string, "null"]
        colorLabel:
          type: [string, "null"]
        keywords:
          type: array
          items:
            type: string
        editedByHdrToys:
          type: boolean
        thumbnailUrl:
          type: string
    ErrorResponse:
      type: object
      description: Body of every non-2xx JSON response.
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              enum: [bad-request, invalid-path, unauthorized, forbidden, origin-not-allowed, not-found, payload-too-large, unsupported-media-type, unprocessable-entity, rate-limited, unsupported-capability, service-unavailable, internal-error]
            message:
              type: string
    ChangeOp:
      type: object
      required: [seq, device, hlc, assetKey, assetId, field, outcome]
      properties:
        seq:
          type: integer
        device:
          type: string
        hlc:
          type: string
        assetKey:
          type: string
        assetId:
          type: string
        field:
          type: string
        value: {}
        outcome:
          type: string
    ChangesResponse:
      type: object
      required: [ops, assets, nextCursor]
      properties:
        ops:
          type: array
          items:
            $ref: "#/components/schemas/ChangeOp"
        assets:
          type: array
          items:
            $ref: "#/components/schemas/AssetSummary"
        nextCursor:
          type: string
          description: Opaque cursor to pass as `since` on the next poll.
        snapshotRequired:
          type: boolean
          description: True when `since` is not a position in this server's journal; re-run the initial sync and continue from `nextCursor`.
    TruthOp:
      type: object
      required: [hlc, device, assetKey, field]
      properties:
        hlc:
          type: string
        device:
          type: string
        assetKey:
          type: string
        file:
          type: string
        field:
          type: string
          enum: [rating, flag, colorLabel, keywords, orientation, recipe, stack, variant, import]
        value: {}
        undoGroup:
          type: string
    OpReceipt:
      type: object
      required: [device, hlc, status]
      properties:
        device:
          type: string
        hlc:
          type: string
        status:
          type: string
          enum: [applied, duplicate, stale, rejected]
        originalStatus:
          type: string
        reason:
          type: string
          enum: [asset-not-found, invalid-op]
          description: Present when status is rejected. asset-not-found may succeed on a later retry; invalid-op never will.
    OpsRequest:
      type: object
      required: [ops]
      properties:
        ops:
          type: array
          items:
            $ref: "#/components/schemas/TruthOp"
    OpsResponse:
      type: object
      required: [durable, receipts]
      properties:
        durable:
          type: boolean
        receipts:
          type: array
          items:
            $ref: "#/components/schemas/OpReceipt"
    HandoffPayload:
      type: object
      required: [v, assetId]
      properties:
        v:
          type: integer
        assetId:
          type: string
        recipeHlc:
          type: string
        ui:
          type: object
          additionalProperties: true
paths:
  /:
    get:
      summary: Redirect browser to hdr.toys connected to this library (or return JSON info)
      responses:
        "302":
          description: Redirect to https://hdr.toys/?gallery_api_url=...
        "200":
          description: JSON info when Accept includes application/json
  /open:
    get:
      summary: Redirect browser to hdr.toys deep-linked to an asset
      parameters:
        - name: a
          in: query
          schema:
            type: string
      responses:
        "302":
          description: Redirect to https://hdr.toys/?gallery_api_url=...&image_id=...
  /h/{id}:
    get:
      summary: Redirect browser to hdr.toys with a short-lived handoff token
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "302":
          description: Redirect to https://hdr.toys/?gallery_api_url=...&handoff=...
  /capabilities:
    get:
      summary: Discover server capabilities, profile, permissions, and limits
      responses:
        "200":
          description: Capabilities document
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CapabilitiesResponse"
  /auth/session:
    post:
      summary: Exchange Tailnet peer identity or bearer token for a short-lived session token
      responses:
        "200":
          description: Issued session token and expiry
        "401":
          description: Unauthorized
  /assets/count:
    get:
      summary: Count matching assets
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Asset count
  /assets/range:
    get:
      summary: Fetch an offset/limit slice of assets
      security:
        - BearerAuth: []
      parameters:
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
        - name: limit
          in: query
          schema:
            type: integer
            maximum: 500
        - name: fields
          in: query
          schema:
            type: string
            enum: [grid, full]
        - $ref: "#/components/parameters/Sort"
        - $ref: "#/components/parameters/Dir"
        - $ref: "#/components/parameters/Flag"
        - $ref: "#/components/parameters/Label"
        - $ref: "#/components/parameters/Kind"
      responses:
        "200":
          description: Range slice (`{ total, exact, offset, limit, assets[] }`; items are GridAsset when `fields=grid`)
  /assets:
    get:
      summary: Cursor-paginated asset listing
      security:
        - BearerAuth: []
      parameters:
        - name: cursor
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            maximum: 200
        - $ref: "#/components/parameters/Sort"
        - $ref: "#/components/parameters/Dir"
        - $ref: "#/components/parameters/Flag"
        - $ref: "#/components/parameters/Label"
        - $ref: "#/components/parameters/Kind"
      responses:
        "200":
          description: Asset page (`{ assets[], nextCursor, total }`)
  /assets/{id}:
    get:
      summary: Full asset metadata
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Asset details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssetSummary"
        "404":
          description: Asset not found
  /assets/{id}/blob:
    get:
      summary: Stream original file or serve thumbnail/preview tier
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: tier
          in: query
          schema:
            type: string
            enum: [original, t0, t1, t2, thumb, preview]
        - name: bt
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Full media bytes
        "206":
          description: Partial original bytes
        "304":
          description: Cached thumbnail unchanged
  /assets/{id}/file:
    get:
      summary: Alias for /assets/{id}/blob
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: tier
          in: query
          schema:
            type: string
            enum: [original, t0, t1, t2, thumb, preview]
      responses:
        "200":
          description: Full media bytes
        "206":
          description: Partial original bytes
        "304":
          description: Cached thumbnail unchanged
  /assets/{id}/recipe:
    get:
      summary: Fetch canonical working recipe envelope
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Working recipe envelope `{ assetId, recipe, hlc }`
        "404":
          description: Asset not found, or the asset has no working recipe yet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /assets/{id}/rating:
    post:
      summary: Write an asset rating (0-5) durably as an HLC op
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [rating]
              properties:
                rating:
                  type: integer
                  minimum: 0
                  maximum: 5
      responses:
        "200":
          description: Rating committed (`{ ok, assetId, rating, durable, receipts }`)
        "400":
          description: Missing or out-of-range rating
        "404":
          description: Asset not found
  /assets/{id}/variants/{variantId}/recipe:
    get:
      summary: Fetch one variant's recipe JSON
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: variantId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Variant recipe JSON
        "404":
          description: Asset or variant not found, or the variant is tombstoned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /assets/{id}/variants:
    get:
      summary: Fetch immutable creative variants and tombstones
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Variants list
  /assets/{id}/variants/{variantId}:
    delete:
      summary: Tombstone a variant
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: variantId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Tombstone committed
  /assets/{id}/edit-thumbnail:
    put:
      summary: Upload edited preview JPEG (<= 4 MiB)
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Thumbnail saved
  /assets/{id}/renders:
    get:
      summary: List uploaded rendered exports
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Render entries
    post:
      summary: Idempotently upload a rendered export
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: Idempotency-Key
          in: header
          schema:
            type: string
      responses:
        "200":
          description: Render persisted
  /ops:
    post:
      summary: Commit a batch of HLC-stamped truth operations
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OpsRequest"
      responses:
        "200":
          description: Durable receipts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpsResponse"
        "400":
          description: Malformed body or op envelope; nothing was applied
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "413":
          description: More than `limits.maxOpsBatch` ops or `limits.maxOpsBodyBytes` body bytes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /changes:
    get:
      summary: Poll monotonic change feed
      security:
        - BearerAuth: []
      parameters:
        - name: since
          in: query
          description: Opaque `nextCursor` of the previous page; omit to bootstrap.
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            maximum: 500
      responses:
        "200":
          description: Operations and affected assets since cursor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChangesResponse"
  /handoff:
    post:
      summary: Store an ephemeral 5-minute handoff state for QR pickup
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HandoffPayload"
      responses:
        "200":
          description: Handoff ID and short URL
  /handoff/{id}:
    get:
      summary: Retrieve an ephemeral handoff payload
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Stored handoff state
        "404":
          description: Handoff expired or missing
